<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeVerse Login</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#fbe7ff,#f7d6ec,#dff6ff);
    min-height:100vh;
}

/* Navbar */

.navbar{
    background:#f1b3eb;
    display:flex;
    align-items:center;
    padding:15px 40px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#222;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:30px;
    margin:0 auto;
}

.nav-links a{
    text-decoration:none;
    color:#222;
    font-size:18px;
    transition:.3s;
}

.nav-links a:hover{
    color:#ffffff;
}

.bell{
    font-size:22px;
    cursor:pointer;
}
.bell:hover{
    color: #f2eded;
}

/* Login Section */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:calc(100vh - 75px);
}

.login-box{
    width:380px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    text-align:center;
}

.login-box h2{
    color:#e06cb8;
    margin-bottom:10px;
}

.login-box p{
    color:#666;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
    text-align:left;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#555;
}

.input-box input{
    width:100%;
    padding:12px;
    border:2px solid #f1b3eb;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

.input-box input:focus{
    border-color:#d46bb3;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#f1b3eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e06cb8;
}

.register{
    margin-top:20px;
    color:#666;
}

.register a{
    text-decoration:none;
    color:#d63384;
    font-weight:bold;
}
</style>

</head>
<script>

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");


window.onload = function () {

    if(localStorage.getItem("email")){
        email.value = localStorage.getItem("email");
    }

    if(localStorage.getItem("password")){
        password.value = localStorage.getItem("password");
    }

}


form.addEventListener("submit", function(event){

    event.preventDefault();

    localStorage.setItem("email", email.value);
    localStorage.setItem("password", password.value);

    alert("Login details saved successfully!");

});

</script>
<body>

<nav class="navbar">

    <div class="logo">CodeVerse</div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
    </ul>

    <div class="bell">
        <i class="fa-solid fa-bell"></i>
    </div>

</nav>

<div class="container">

    <div class="login-box">

        <h2>Welcome Back </h2>
        <p>Login to continue learning.</p>

        <form>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>

    </div>

</div>


</body>
</html>
